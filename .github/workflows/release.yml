name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest

      - name: Install required SDK packages
        run: |
          sdkmanager --install "platform-tools" "build-tools;37.0.0" || true

      - name: Decode signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Bundle Play AAB
        run: ./gradlew bundleLawnWithQuickstepPlayRelease --stacktrace

      - name: Archive AAB and mapping
        uses: actions/upload-artifact@v7
        with:
          name: play-release
          path: |
            build/outputs/bundle/**/*.aab
            build/outputs/mapping/**/mapping.txt
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
