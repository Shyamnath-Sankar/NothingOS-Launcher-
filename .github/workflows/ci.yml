name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # compileSdk 37 / buildTools 37.0.0 are newer than the runner image's
      # preinstalled SDK. Accept licenses and let AGP download what it needs.
      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/cmdline-tools
            /usr/local/lib/android/sdk/licenses
          key: android-sdk-37-buildtools-v1

      - uses: android-actions/setup-android@v3
        with:
          # 'tools' was removed from current SDK repositories; install platform-tools only.
          packages: 'platform-tools'

      - name: Install required SDK packages
        run: |
          sdkmanager --install "platform-tools" "build-tools;37.0.0" || true

      - name: Assemble Play debug
        run: ./gradlew assembleLawnWithQuickstepPlayDebug --stacktrace

      - name: Verify Play manifest and identity
        run: |
          sh scripts/verify-play-build-test.sh
          sh scripts/verify-play-build.sh

      - name: Upload merged manifest evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: play-merged-manifests
          path: |
            build/intermediates/merged_manifest/**/AndroidManifest.xml
            build/intermediates/merged_manifests/**/AndroidManifest.xml
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: lawnWithQuickstepPlayDebug
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Cache emulator SDK packages
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-37.0
          key: android-api37-default-x86_64-v1

      - name: Enable KVM for disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API 37 install and home smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          system-image-api-level: "37.0"
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            count=$(find build/outputs/apk -type f -name '*debug*.apk' | wc -l)
            test "$count" -eq 1
            apk=$(find build/outputs/apk -type f -name '*debug*.apk')
            test "$(adb -s emulator-5554 shell getprop ro.kernel.qemu | tr -d '\r')" = 1
            sh scripts/emulator-smoke.sh --serial emulator-5554 --apk "$apk" --artifacts build/emulator-smoke/ci

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api37-emulator-evidence
          path: build/emulator-smoke/ci/**
          if-no-files-found: warn

  check-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/cmdline-tools
            /usr/local/lib/android/sdk/licenses
          key: android-sdk-37-buildtools-v1

      - uses: android-actions/setup-android@v3
        with:
          # 'tools' was removed from current SDK repositories; install platform-tools only.
          packages: 'platform-tools'

      - run: ./gradlew spotlessCheck --stacktrace

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/cmdline-tools
            /usr/local/lib/android/sdk/licenses
          key: android-sdk-37-buildtools-v1

      - uses: android-actions/setup-android@v3
        with:
          # 'tools' was removed from current SDK repositories; install platform-tools only.
          packages: 'platform-tools'

      - name: Run unit tests
        run: ./gradlew testLawnWithQuickstepPlayDebugUnitTest --stacktrace

      - name: Verify predicate tests executed
        run: |
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          paths = glob.glob('build/test-results/**/TEST-*LockedProfilePredicateTest.xml', recursive=True)
          assert len(paths) == 1, paths
          root = ET.parse(paths[0]).getroot()
          assert int(root.get('tests', 0)) == 4, root.attrib
          assert all(int(root.get(k, 0)) == 0 for k in ('failures', 'errors', 'skipped')), root.attrib
          print('Verified all four locked-profile predicate tests executed and passed')
          PYTEST

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            build/reports/tests/**
            build/test-results/**
